name: Deploy notatek na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie przerywaj trwającego deployu, kolejkuj następny.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pełna historia — wtyczka git-revision-date czyta daty commitów

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Zainstaluj MkDocs Material
        run: pip install -r requirements.txt

      - name: Zbuduj stronę
        run: mkdocs build --strict

      - name: Skonfiguruj Pages
        uses: actions/configure-pages@v5

      - name: Wyślij artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Opublikuj na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
